# ============================================================
# GLOW /om 缓存代理 —— 这份文件是线上实际配置的拷贝，部署时整段替换即可
# 线上拓扑：站点机 nginx → 127.0.0.1:8790（SSH 反向隧道）→ 算力机 cache-proxy.js → Open-Meteo
# 前端取数顺序：直连优先 → 限流/超时才走 /om，所以这是兜底路径
#
# 安装：
#   1) 下面「HTTP 段」的内容放进 /etc/nginx/conf.d/glow-cache.conf（http 上下文）
#   2) 「SERVER 段」放进 /etc/nginx/snippets/glow-om.conf，并在 443 的 server{} 里 include
#   3) nginx -t && systemctl reload nginx
# ============================================================

# ---------------- HTTP 段（必须写在 http{} 里） ----------------
# 霞（GLOW）Open-Meteo 缓存：10 分钟，1GB
proxy_cache_path /var/cache/nginx/glow levels=1:2 keys_zone=glow_om:20m max_size=1g inactive=30m use_temp_path=off;
# 下面三个 upstream 只在使用「接法 A（站点机直连上游）」时需要；用隧道时留着无害
upstream glow_forecast { server api.open-meteo.com:443; keepalive 16; }
upstream glow_air { server air-quality-api.open-meteo.com:443; keepalive 16; }
upstream glow_geo { server geocoding-api.open-meteo.com:443; keepalive 16; }
map $request_uri $glow_cache_key { default $request_uri; }

# ---------------- SERVER 段（放进 server{}） ----------------
# Open-Meteo 走 算力机（IP 见 OPS.local.md） 的缓存代理（额度独立），经 SSH 反向隧道到本机 8790
location /om/v1/ {
  gzip on; gzip_proxied any; gzip_types application/json; gzip_min_length 512;
  proxy_pass http://127.0.0.1:8790/v1/;
  proxy_hide_header X-Glow-Cache;
  proxy_http_version 1.1; proxy_set_header Connection "";
  proxy_cache glow_om; proxy_cache_key $glow_cache_key;
  proxy_cache_valid 200 10m; proxy_cache_valid 429 1s;
  proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504 http_429;
  proxy_cache_background_update on; proxy_cache_lock on;
  proxy_hide_header Cache-Control;
  add_header Cache-Control "public, max-age=300";
  add_header X-Glow-Cache $upstream_cache_status always;
}
location /om/air-quality/v1/ {
  gzip on; gzip_proxied any; gzip_types application/json; gzip_min_length 512;
  proxy_pass http://127.0.0.1:8790/air-quality/v1/;
  proxy_hide_header X-Glow-Cache;
  proxy_http_version 1.1; proxy_set_header Connection "";
  proxy_cache glow_om; proxy_cache_key $glow_cache_key;
  proxy_cache_valid 200 10m; proxy_cache_valid 429 1s;
  proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504 http_429;
  proxy_cache_background_update on; proxy_cache_lock on;
  proxy_hide_header Cache-Control;
  add_header Cache-Control "public, max-age=300";
  add_header X-Glow-Cache $upstream_cache_status always;
}
location /om/geo/v1/ {
  gzip on; gzip_proxied any; gzip_types application/json; gzip_min_length 512;
  proxy_pass http://127.0.0.1:8790/geo/v1/;
  proxy_hide_header X-Glow-Cache;
  proxy_http_version 1.1; proxy_set_header Connection "";
  proxy_cache glow_om; proxy_cache_key $glow_cache_key;
  proxy_cache_valid 200 1h;
  proxy_cache_use_stale error timeout updating http_429;
  add_header X-Glow-Cache $upstream_cache_status always;
}
