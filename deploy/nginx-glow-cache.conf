# GLOW /om 缓存代理 —— 与线上一致（2026-10-24）
# 取数顺序是「直连优先 → 限流/失败才走 /om」，所以这是兜底路径，不是主路径。
# 线上用接法 B：站点机 → SSH 反向隧道 → 算力机的 cache-proxy.js（127.0.0.1:8790）
# 接法 A（站点机直连上游）见每个 location 里的注释。
# 用法：把这个文件的内容粘到站点的 server { } 块里，然后
#   nginx -t && systemctl reload nginx
# 前端启用：在页面 <head> 里、加载 ../api.js 之前加
#   <script>window.GLOW_OM_BASE = '/om';</script>

# ---- 缓存区：10 分钟，1GB 上限 ----
proxy_cache_path /var/cache/nginx/glow levels=1:2 keys_zone=glow_om:20m
                 max_size=1g inactive=30m use_temp_path=off;

# 上游：预报 / 空气质量
upstream glow_forecast { server api.open-meteo.com:443; keepalive 16; }
upstream glow_air      { server air-quality-api.open-meteo.com:443; keepalive 16; }

# 缓存键：完整 URL（含经纬度与参数），不区分 Accept-Encoding 之外的请求头
map $request_uri $glow_cache_key {
    default $request_uri;
}

# ---- 预报 ----
location /om/v1/ {
    gzip on; gzip_proxied any; gzip_types application/json; gzip_min_length 512;
    proxy_pass https://glow_forecast/v1/;
    proxy_ssl_server_name on;
    proxy_set_header Host api.open-meteo.com;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_cache glow_om;
    proxy_cache_key $glow_cache_key;
    proxy_cache_valid 200 10m;
    proxy_cache_valid 404 1m;
    proxy_cache_valid 429 1s;   # 前端会重试，缓存久了等于必然命中
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504 http_429;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    add_header X-Glow-Cache $upstream_cache_status always;

    # 缓存命中时也让浏览器缓存 5 分钟
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=300";   # 不加 always：错误响应别让浏览器缓存
}

# ---- 空气质量 ----
location /om/air-quality/v1/ {
    gzip on; gzip_proxied any; gzip_types application/json; gzip_min_length 512;
    proxy_pass https://glow_air/v1/;
    proxy_ssl_server_name on;
    proxy_set_header Host air-quality-api.open-meteo.com;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_cache glow_om;
    proxy_cache_key $glow_cache_key;
    proxy_cache_valid 200 10m;
    proxy_cache_valid 429 1s;   # 前端会重试，缓存久了等于必然命中
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504 http_429;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    add_header X-Glow-Cache $upstream_cache_status always;

    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=300";   # 不加 always：错误响应别让浏览器缓存
}

# ---- 地理编码（搜索用，量小但也要跨域） ----
location /om/geo/v1/ {
    gzip on; gzip_proxied any; gzip_types application/json; gzip_min_length 512;
    proxy_pass https://geocoding-api.open-meteo.com/v1/;
    proxy_ssl_server_name on;
    proxy_set_header Host geocoding-api.open-meteo.com;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_cache glow_om;
    proxy_cache_key $glow_cache_key;
    proxy_cache_valid 200 1h;
    proxy_cache_use_stale error timeout updating http_429;
    add_header X-Glow-Cache $upstream_cache_status always;
}
